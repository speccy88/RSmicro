name: macOS CI
on: [push, pull_request]

jobs:
  test:
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -e '.[dev]'
      - run: python --version && cmake --version && make --version
      - run: python tools/generate_instruction_registry.py --check && python tools/generate_c_conformance_fixtures.py --check && python tools/generate_rsm_link_registry.py --check
      - run: cmake -S . -B build -G "Unix Makefiles" -DRSM_BUILD_TESTS=ON -DRSM_BUILD_SHARED=ON -DRSM_ENABLE_STRICT_WARNINGS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: ruff check .
      - run: mypy src/rsmicro
      - run: pytest -q --junitxml=build/pytest.xml
      - run: python tools/validate_repository.py
      - run: python -m build
      - run: python tools/run_integrated_demo.py --headless --format json --artifacts-dir build/integrated-demo
