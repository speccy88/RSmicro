[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-ascii"
version = "0.1.0"
description = "ASCII ladder logic editor, simulator, and remote runtime scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Markdown>=3.6",
  "pyserial>=3.5",
  "tkinterweb>=4.2.0",
  "jsonschema>=4.18",
  "websockets>=12",
  "PySide6>=6.7",
]

[project.optional-dependencies]
serial = []
dev = ["pytest>=7.4", "pytest-qt>=4.4"]

[project.scripts]
plc-ascii = "plc_ascii.ide:main"
plc-ascii-cli = "plc_ascii.app:main"
plc-runtime = "plc_runtime.runtime:main"
rsmicro = "rsmicro.cli:main"
rsmicro-tagd = "rsmicro.scada.cli:main"
rsmicro-studio = "rsmicro.studio.main:main"
rsmicro-scada = "rsmicro.scada_runtime.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"plc_runtime.propeller2" = ["runtime.fth"]
"rsmicro.schemas" = ["*.json"]
