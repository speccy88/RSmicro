[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-ascii"
version = "0.1.0"
description = "ASCII ladder logic editor, simulator, and remote runtime scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Markdown>=3.6",
  "pyserial>=3.5",
  "tkinterweb>=4.2.0",
  "jsonschema>=4.18",
  "websockets>=12",
]

[project.optional-dependencies]
serial = []
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.10", "build>=1.2"]

[project.scripts]
plc-ascii = "plc_ascii.ide:main"
plc-ascii-cli = "plc_ascii.app:main"
plc-runtime = "plc_runtime.runtime:main"
rsmicro = "rsmicro.cli:main"
rsmicro-tagd = "rsmicro.scada.cli:main"

[tool.pytest.ini_options]
markers = [
  "unit: isolated unit tests",
  "integration: tests joining two or more components",
  "end_to_end: complete application workflows",
  "gui: tests requiring a Qt application",
  "network: tests using loopback sockets",
  "slow: tests that normally take more than one second",
  "hardware: tests requiring explicitly selected physical hardware",
]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
# The preserved legacy code predates formatter adoption. Keep CI focused on
# correctness-class errors until it can be reformatted in a dedicated change.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"plc_runtime.propeller2" = ["runtime.fth"]
"rsmicro.schemas" = ["*.json"]
